<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Autonomous Event Planning Agent{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="brand">
                <img class="rocky-brand-logo" src="{{ url_for('static', filename='images/rocky-brand.svg', v=1) }}" alt="ROCKY logo">
            </div>
            <nav class="nav flex-column mt-2">
                <a class="nav-link" href="/">Home</a>
                <a class="nav-link" href="/create-event">Create Event</a>
                <a class="nav-link" href="/planning">AI Planning</a>
                <a class="nav-link" href="/tasks">Task Management</a>
                <a class="nav-link" href="/dashboard">Dashboard</a>
                <a class="nav-link" href="/recommendations">Recommendations</a>
                <a class="nav-link" href="/chat">AI Chat</a>
            </nav>
        </aside>
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
